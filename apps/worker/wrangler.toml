name = "x-post-ingest"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Cron Trigger（`src/index.ts`の`scheduled`ハンドラ）。1時間毎。
#     Apple側トークン失効の再試行・RevenueCatイベント再試行・猶予期間経過後のアカウント物理削除
#     （Mobile-G2A残修正: これが無いとscheduledハンドラのコードが存在していても本番では
#     一切呼ばれず、`POST /internal/*/retry-batch`の手動実行に頼るしかなかった）。
[triggers]
crons = ["0 * * * *"]

# --- 管理画面（Phase 7）の商品画像保存用R2バケット。`GET /images/:key`で配信する
#     （バケット自体は非公開のまま、Worker経由でのみ読み出す。公開URL発行やCORS設定が
#     不要になるため、r2.dev Public Access等の追加のダッシュボード操作を要さない）。
[[r2_buckets]]
binding = "LOTTERY_IMAGES"
bucket_name = "cardhub-lottery-images"

# --- シークレット（`wrangler secret put <NAME>` で登録。ここには値を書かない） ---
#   INGEST_TOKEN        … /ingest の Bearer トークン（/internal/* の内部APIもこれを流用）
#   TURSO_DATABASE_URL  … libsql://<db>.turso.io
#   TURSO_AUTH_TOKEN    … Turso のトークン
#
# --- 認証（Mobile-G2A）。本番では下記すべてが必須（未設定・プレースホルダー値は
#     起動時ではなく認証ルートへのリクエスト時に503 AUTH_NOT_CONFIGUREDでfail-closedになる）---
#   ENVIRONMENT                       … 'development' | 'test' | 'preview' | 'production' のいずれか必須
#   APPLE_CLIENT_ID                   … Sign in with Apple のaudience（Bundle Identifier）
#   JWT_SIGNING_KEY_CURRENT_KID       … Access Token署名鍵の世代タグ（例: "v1"）
#   JWT_SIGNING_KEY_CURRENT_SECRET    … Access Token署名鍵（HS256）
#   JWT_SIGNING_KEY_PREVIOUS_KID      … （鍵ローテーション中のみ）直前世代の世代タグ
#   JWT_SIGNING_KEY_PREVIOUS_SECRET   … （鍵ローテーション中のみ）直前世代の署名鍵
#   ACCOUNT_DELETION_GRACE_DAYS       … アカウント削除の猶予日数（本番では必須、正式日数は未確定）
#
# --- Apple authorizationCode交換・トークン失効（Mobile-G2A-Hardening、任意機能）---
#     4つとも未設定ならこの機能は無効化される（ログイン・アカウント削除自体は継続する）。
#     正式な.p8鍵が発行されるまでは本番でも未設定のままでよい。
#   APPLE_TEAM_ID                          … Apple Developer Team ID
#   APPLE_KEY_ID                           … Sign in with Apple用秘密鍵のKey ID
#   APPLE_PRIVATE_KEY                      … .p8ファイルの中身（PEM形式）。リポジトリへ絶対に含めない
#   APPLE_TOKEN_ENCRYPTION_KEY             … Apple Refresh Token暗号化鍵（Base64、32byte/AES-256-GCM）
#   APPLE_TOKEN_ENCRYPTION_KEY_VERSION     … 上記鍵の世代タグ（未設定時 'v1'）
#   APPLE_TOKEN_ENCRYPTION_KEY_PREVIOUS        … （鍵ローテーション中のみ）直前世代の暗号鍵
#   APPLE_TOKEN_ENCRYPTION_KEY_PREVIOUS_VERSION … （鍵ローテーション中のみ）直前世代の世代タグ
#
# --- RevenueCat課金基盤（Mobile-G4）。未設定の間は対応する機能が503 BILLING_NOT_CONFIGURED /
#     failed_retryableとしてfail-closedになる（他の既存機能には影響しない）---
#   REVENUECAT_WEBHOOK_AUTH_HEADER     … RevenueCat WebhookのAuthorization header共有値
#   REVENUECAT_WEBHOOK_HMAC_SECRET     … RevenueCat公式HMAC署名検証用シークレット（Authorization headerと併用必須の方針）
#   REVENUECAT_SECRET_API_KEY          … RevenueCat REST API用Secret API Key（`sk_`プレフィックス）
#   REVENUECAT_MONTHLY_PRODUCT_ID      … 月額Product ID（確定値: cardhub_premium_monthly）
#   REVENUECAT_LIFETIME_PRODUCT_ID     … 買い切りProduct ID（確定値: cardhub_premium_lifetime）
#
#   ※ App Store Connect API Key・In-App Purchase Key（いずれも.p8）はRevenueCatダッシュボードへ
#     直接アップロードするものであり、このWorker・このリポジトリのどこにも保存しない
#     （Cloudflare Secrets・.env・wrangler.tomlのいずれにも登場しない）。
#
# ※ Workers 本番では db/client.ts の @libsql/client を @libsql/client/web へ切替が必要。
#   （ローカル検証は `npm run worker:dev` の Node サーバーで行う）

# --- 環境分離（Mobile-G4 Hardening）: RevenueCat Webhook疎通確認等をいきなりproductionへ
#     向けないためのstaging環境。`wrangler deploy --env staging`で本番とは別名のWorkerとして
#     デプロイされる（デフォルトの`*.workers.dev`URLも本番と別になる）。
#     Secretsは環境ごとに独立するため、`wrangler secret put <NAME> --env staging`で別途登録する
#     （本番のTURSO_DATABASE_URL等とは物理的に別のTurso DBを指すこと——Sandboxイベントが
#     本番DBへ混入しないようにするための必須要件）。
#     このブロック自体はまだ実デプロイしていない（scaffoldingのみ）。
[env.staging]
name = "x-post-ingest-staging"

[[env.staging.r2_buckets]]
binding = "LOTTERY_IMAGES"
bucket_name = "cardhub-lottery-images-staging"
